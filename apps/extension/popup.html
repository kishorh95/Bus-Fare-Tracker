<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>BusFare Tracker</title><link rel="stylesheet" href="popup.css"></head>
<body><main><header><span class="logo">₹</span><div><h1>BusFare Tracker</h1><p>Manual fare capture</p></div></header><p class="notice">Enter a fare you observed yourself. This extension does not read redBus pages.</p><form id="fare-form"><label>Booking platform<input id="platform" value="redBus" required></label><div class="pair"><label>Origin<input id="origin" value="Bengaluru" required></label><label>Destination<input id="destination" value="Pune" required></label></div><label>Travel date<input id="travel-date" type="date" required></label><label>Bus / operator description<input id="service" placeholder="e.g. AC Sleeper, operator name" required></label><label>Displayed total fare (₹)<input id="fare" type="number" min="1" step="0.01" placeholder="e.g. 1499" required></label><button type="submit">Save observed fare</button><p id="status" role="status"></p></form><section><h2>Recent local observations</h2><ul id="history"><li class="empty">No fares saved yet.</li></ul><button id="export" class="secondary" type="button">Export CSV</button></section><footer>Saved in this browser only · Demo v0.1</footer></main><script src="popup.js"></script></body></html>
